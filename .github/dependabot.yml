# Weekly update PRs for the pinned Python requirements and the SHA-pinned GitHub Actions.
# Security fixes arrive as soon as an advisory is published (turn on Dependabot security
# updates in Settings > Code security).
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/packaging/macos"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
