name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Ruff (bugs and security smells; config in ruff.toml)
        run: |
          python -m pip install ruff==0.16.9
          ruff check --output-format=github .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Linux system deps (PortAudio, X11 clipboard/keys, virtual display)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb xclip xdotool
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Voice models (real-model smoke test)
        if: runner.os == 'Linux'
        run: |
          python -m spoke enroll --download-only
          echo "SPOKE_VOICE_MODELS=$HOME/.spoke/models" >> "$GITHUB_ENV"
      - name: Unit tests
        if: runner.os != 'Linux'
        run: python -m pytest -q
        env:
          SPOKE_NATIVE_TESTS: "1"   # real clipboard round-trip on macOS / Windows
      - name: Unit tests (under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a env XDG_SESSION_TYPE=x11 SPOKE_NATIVE_TESTS=1 python -m pytest -q
      - name: Doctor (informational; no key, mic or permissions on CI)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a env XDG_SESSION_TYPE=x11 python -m spoke doctor || true
          else python -m spoke doctor || true; fi
