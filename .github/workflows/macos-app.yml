name: macos-app
# Builds Spoke.app + a .dmg on real Macs, checks the bundle actually works, and uploads the .dmg.
# Download it from the run's "Artifacts" section; tags (v*) also attach it to a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon (M1 and later)
            arch: arm64
          - runner: macos-15-intel  # Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt -r packaging/macos/requirements-build.txt
      - name: Build Spoke.app and .dmg
        run: PYTHON=python packaging/macos/build.sh
      - name: Self-test the bundle (native libs, Keychain backend, voice models)
        env:
          SPOKE_HOME: ${{ runner.temp }}/spoke-home
        run: |
          APP=dist/Spoke.app/Contents/MacOS/Spoke
          "$APP" --version
          "$APP" enroll --download-only      # the bundle's own HTTPS + certificates
          "$APP" --self-test
          "$APP" doctor || true              # informational: no key, mic or permissions on CI
      - name: Launch the app (first-run dialog must come up without crashing)
        # Launched through LaunchServices like a double-click, so it uses the runner's ~/.spoke.
        run: |
          open -n dist/Spoke.app
          sleep 20
          if pgrep -f "Spoke.app/Contents/MacOS/Spoke" >/dev/null; then
            echo "Spoke.app is running (waiting on the Groq key dialog)."
            pkill -f "Spoke.app/Contents/MacOS/Spoke" || true
          else
            echo "Spoke.app exited on launch"; cat "$HOME/.spoke/spoke.log" 2>/dev/null || true; exit 1
          fi
          if grep -q Traceback "$HOME/.spoke/spoke.log" 2>/dev/null; then cat "$HOME/.spoke/spoke.log"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Spoke-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dmg
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dmg/*.dmg
