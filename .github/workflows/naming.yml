name: naming
# Branch names and PR titles follow CONTRIBUTING.md > Naming conventions.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  naming:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name and PR title
        env:
          # Untrusted input: passed through env, never interpolated into the script.
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|test|refactor|perf|ci|chore'
          ok=1

          if [[ "$BRANCH" =~ ^(dependabot|claude)/ ]]; then
            echo "Branch '$BRANCH' is exempt (bot branch)."
          elif [[ "$BRANCH" =~ ^($types)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Branch '$BRANCH' is fine."
          else
            echo "::error::Branch '$BRANCH' should be <type>/<short-description>, e.g. feat/voice-commands or fix/42-tray-crash (lowercase, hyphens). Types: ${types//|/, }."
            ok=0
          fi

          max=72
          [[ "$BRANCH" == dependabot/* ]] && max=200   # grouped update titles run long
          if [[ "$TITLE" =~ ^($types)(\([a-z0-9._/-]+\))?!?:\ [^[:space:]].*$ ]] && (( ${#TITLE} <= max )) && [[ "$TITLE" != *. ]]; then
            echo "PR title '$TITLE' is fine."
          else
            echo "::error::PR title should be '<type>(<optional scope>): <summary>', at most 72 characters, no full stop at the end, e.g. 'fix(inject): restore RTF clipboard on Windows'. Types: ${types//|/, }."
            ok=0
          fi

          if (( ok == 0 )); then
            echo "See CONTRIBUTING.md > Naming conventions. Rename the branch or edit the PR title and this check re-runs."
            exit 1
          fi
